[package]
name = "uison-ssh-player"
version.workspace = true
edition.workspace = true
publish = false
description = "Connects to a server over SSH, uploads and runs a uison program in console mode, shows it"

# SSH lives only here: the framework and the programs know nothing but stdin/stdout.
[dependencies]
uison-player = { path = "../uison-player" }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
