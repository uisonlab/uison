[package]
name = "uison"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tiny zero-dependency UI framework: screens described in JSON compile to frames of primitives, diffed and partially redrawn by native backends on macOS, Windows, Linux, iOS, Android and the web."
readme = "../../README.md"
keywords = ["gui", "ui", "json", "declarative", "cross-platform"]
categories = ["gui", "wasm"]

[dependencies]
uison-json.workspace = true
uison-core.workspace = true
uison-frame.workspace = true
uison-ui.workspace = true
uison-derive.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
uison-macos.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
uison-ios.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
uison-android.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
uison-web.workspace = true

[target.'cfg(windows)'.dependencies]
uison-windows.workspace = true

[features]
default = ["gui-subsystem"]
# Windows: a release program without a console window (see uison-windows); uison-c turns it off.
gui-subsystem = ["uison-windows/gui-subsystem"]

[target.'cfg(target_os = "linux")'.dependencies]
uison-linux.workspace = true

# Rust lessons (docs/rust/lessons): cargo run -p uison --example 01-hello. Lesson 9 tests run in cargo test.
[[example]]
name = "09-tests"
test = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-apple-ios", "aarch64-linux-android", "wasm32-unknown-unknown"]
