[package]
name = "uison-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Screen compiler of uison: templates, bindings, styles, layout and widgets from JSON to primitive frames. Internal part of uison: use the `uison` crate."

[dependencies]
uison-json.workspace = true
uison-core.workspace = true
uison-frame.workspace = true

[features]
# Live reload (UISON_RELOAD) in release builds too — for the C/C++ library (uison-c): C programs keep
# their screen files next to them, and libuison is only built as release. Rust programs have it in debug anyway.
reload = []
