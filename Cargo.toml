[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"   # let chains
license = "MIT"
repository = "https://github.com/uisonlab/uison"

# Published crates depend on each other by version too (crates.io ignores `path`); bump together with
# workspace.package.version. Publishing: cargo publish --workspace.
[workspace.dependencies]
uison-json = { path = "crates/uison-json", version = "0.1.0" }
uison-core = { path = "crates/uison-core", version = "0.1.0" }
uison-frame = { path = "crates/uison-frame", version = "0.1.0" }
uison-apple = { path = "crates/uison-apple", version = "0.1.0" }
uison-macos = { path = "crates/uison-macos", version = "0.1.0" }
uison-ios = { path = "crates/uison-ios", version = "0.1.0" }
uison-android = { path = "crates/uison-android", version = "0.1.0" }
uison-ui = { path = "crates/uison-ui", version = "0.1.0" }
uison-derive = { path = "crates/uison-derive", version = "0.1.0" }
uison-web = { path = "crates/uison-web", version = "0.1.0" }
uison-windows = { path = "crates/uison-windows", version = "0.1.0", default-features = false }
uison-linux = { path = "crates/uison-linux", version = "0.1.0" }
uison = { path = "crates/uison", version = "0.1.0" }

[profile.release]
opt-level = "s"   # -17% size at -2% paint speed (see Task1.md)
lto = true
codegen-units = 1
panic = "abort"
strip = true

# the strip run by rustc breaks libuison.dylib for Apple's ld ("mis-aligned LINKEDIT
# string pool"); symbols are stripped by tools/c-dist.sh and CMake (strip -x / --strip-unneeded).
[profile.release.package.uison-c]
strip = "none"
